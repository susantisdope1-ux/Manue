<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koseli – Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- Colours (change them here) ---------- */
    :root {
      color-scheme: light;
      --bg: #fbf6ea;
      --paper: #fffdf7;
      --ink: #2b1a1f;
      --muted: #7b6a6e;
      --wine: #7a1f3d;
      --wine-light: #a43257;
      --gold: #b8893a;
      --line: #e6d9bd;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      /* keeps section titles from hiding under the sticky bars */
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 110px);
    }

    body {
      margin: 0;
      background: var(--bg);
      background-image: radial-gradient(#e9dcc0 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: Poppins, system-ui, sans-serif;
      line-height: 1.5;
    }

    /* ---------- Phone bar (top) ---------- */
    .top-bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      background: var(--wine);
      color: #f6e7c1;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .top-bar a {
      padding: 3px 16px;
      border-radius: 999px;
      background: #f6e7c1;
      color: var(--wine);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: ring 3s ease-in-out infinite;
    }

    .top-bar a:hover {
      transform: scale(1.07);
      box-shadow: 0 0 0 4px rgba(246, 231, 193, 0.35);
    }

    /* small shake every few seconds, like a ringing phone */
    @keyframes ring {
      0%, 88%, 100% { transform: rotate(0); }
      91% { transform: rotate(-4deg); }
      94% { transform: rotate(4deg); }
      97% { transform: rotate(-2deg); }
    }

    /* ---------- Header ---------- */
    .site-header {
      padding: 38px 20px 16px;
      text-align: center;
      animation: drop-in 0.9s ease both;
    }

    .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(46px, 12vw, 86px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 2px;
      /* gold shine that slides across the name */
      background: linear-gradient(100deg, var(--wine) 30%, var(--gold) 50%, var(--wine) 70%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 320px;
      margin: 10px auto 0;
      color: var(--gold);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .divider::after { transform: scaleX(-1); }

    .tagline {
      margin: 8px 0 0;
      color: var(--muted);
      font-family: "Playfair Display", serif;
      font-size: 14px;
      font-style: italic;
    }

    @keyframes shine { to { background-position: -250% 0; } }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-18px); } }

    /* ---------- Category links ---------- */
    .category-nav {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 44px);
      z-index: 9;
      padding: 10px 16px;
      background: var(--bg);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      white-space: nowrap;
      text-align: center;
      scrollbar-width: none;
    }

    .category-nav a {
      position: relative;
      display: inline-block;
      margin: 0 4px;
      padding: 5px 14px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }

    /* underline that draws itself on hover */
    .category-nav a::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 1px;
      height: 2px;
      background: var(--wine);
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .category-nav a:hover,
    .category-nav a:focus-visible {
      color: var(--wine);
      outline: none;
    }

    .category-nav a:hover::after,
    .category-nav a:focus-visible::after {
      transform: scaleX(1);
    }

    /* ---------- Menu sheet ---------- */
    .sheet {
      width: calc(100% - 24px);
      max-width: 1000px;
      margin: 24px auto;
      padding: 6px;
      background: var(--paper);
      border: 1px solid var(--gold);
      box-shadow: 0 10px 40px rgba(122, 31, 61, 0.12);
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px 44px;
      padding: 12px 20px 26px;
      border: 3px double var(--gold);
    }

    @media (min-width: 760px) {
      .menu { grid-template-columns: 1fr 1fr; }
    }

    /* sections start hidden and fade up when scrolled into view */
    .menu section {
      padding-top: 22px;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .menu section.visible {
      opacity: 1;
      transform: none;
    }

    h2 {
      margin: 0 0 4px;
      color: var(--wine);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }

    h2::after {
      content: "❖";
      display: block;
      margin-top: 2px;
      color: var(--gold);
      font-size: 12px;
    }

    .note {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
      text-align: center;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* each row: name ........ price (the dots are the ::after) */
    li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 15px;
      cursor: default;
      transition: background 0.25s, transform 0.25s, padding 0.25s;
    }

    li::after {
      content: "";
      order: 1;
      flex: 1;
      border-bottom: 2px dotted var(--line);
      transform: translateY(-4px);
    }

    li .name { order: 0; transition: color 0.25s; }
    li .price { order: 2; color: var(--wine); font-weight: 600; white-space: nowrap; }

    li:hover {
      padding-left: 14px;
      background: linear-gradient(90deg, #f7e9ec, transparent);
      transform: translateX(6px);
    }

    li:hover .name { color: var(--wine); }
    li:hover::after { border-color: var(--wine-light); }

    li:hover .name::before {
      content: "➤ ";
      color: var(--gold);
      font-size: 11px;
    }

    /* ---------- Footer ---------- */
    .site-footer {
      padding: 10px 16px calc(34px + env(safe-area-inset-bottom, 0px));
      color: var(--muted);
      font-family: "Playfair Display", serif;
      font-size: 14px;
      font-style: italic;
      text-align: center;
    }

    .site-footer a {
      color: var(--wine);
      font-family: Poppins, sans-serif;
      font-style: normal;
      font-weight: 700;
      text-decoration: none;
    }

    /* people who turned animations off get a calm page */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .menu section { opacity: 1; transform: none; }
    }
  </style>
</head>

    var nav = document.getElementById("category-nav");
    var menuEl = document.getElementById("menu");

    // Stops names like "Tom & Jerry" from breaking the HTML
    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
      });
    }

    // Build the category links and the menu sections
    MENU.forEach(function (category) {
      nav.insertAdjacentHTML(
        "beforeend",
        '<a href="#' + category.id + '">' + escapeHtml(category.title) + "</a>"
      );

      var html = '<section id="' + category.id + '">';
      html += "<h2>" + escapeHtml(category.title) + "</h2>";

      if (category.note) {
        html += '<p class="note">' + escapeHtml(category.note) + "</p>";
      }

      html += "<ul>";
      category.items.forEach(function (item) {
        var name = item[0];
        var price = item[1];
        html += '<li><span class="name">' + escapeHtml(name) + "</span>";
        if (price) {
          html += '<span class="price">' + CURRENCY + " " + escapeHtml(price) + "</span>";
        }
        html += "</li>";
      });
      html += "</ul></section>";

      menuEl.insertAdjacentHTML("beforeend", html);
    });

    // Fade each section in when it scrolls into view
    var sections = document.querySelectorAll(".menu section");

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });

      sections.forEach(function (section) { observer.observe(section); });
    } else {
      // older browsers: just show everything
      sections.forEach(function (section) { section.classList.add("visible"); });
    }
